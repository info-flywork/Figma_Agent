<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasarım paneli</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#icerik">İçeriğe geç</a>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M12 2.2 13.7 8.6 20.2 10.2 13.7 11.8 12 18.2 10.3 11.8 3.8 10.2 10.3 8.6 12 2.2Z"/>
          </svg>
        </span>
        <span class="word">Panel</span>
      </div>
      <nav id="nav" aria-label="Panel"></nav>
    </aside>
    <div class="workspace">
      <header class="top">
        <label class="search">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21 21-4.34-4.34"/>
            <circle cx="11" cy="11" r="8"/>
          </svg>
          <span class="sr">Ara</span>
          <input id="filter" type="search" placeholder="Proje veya ekran ara…" autocomplete="off" enterkeyhint="search">
          <kbd class="kbd" aria-hidden="true">⌘K</kbd>
        </label>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </header>
      <div class="pagehead">
        <div>
          <h1 id="title">Projeler</h1>
          <p class="summary" id="summary"></p>
        </div>
        <div class="head-actions">
          <button type="button" class="primary" id="add-project" hidden aria-haspopup="dialog" aria-controls="project-dialog">Proje ekle</button>
          <p class="count" id="count"></p>
          <button type="button" id="library" hidden>Kütüphane</button>
          <button type="button" class="icon-btn" id="settings" hidden aria-haspopup="dialog" aria-controls="settings-dialog">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span class="sr">Proje ayarları</span>
          </button>
        </div>
      </div>
      <main id="icerik"></main>
    </div>
  </div>
  <dialog id="project-dialog" aria-labelledby="project-title">
    <div class="dialog-head">
      <h2 id="project-title">Yeni proje</h2>
      <button type="button" class="icon-btn" id="project-close">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
        <span class="sr">Kapat</span>
      </button>
    </div>
    <div id="project-body"></div>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-head">
      <h2 id="settings-title">Dosyalar</h2>
      <button type="button" class="icon-btn" id="settings-close">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
        <span class="sr">Kapat</span>
      </button>
    </div>
    <div id="settings-body"></div>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
